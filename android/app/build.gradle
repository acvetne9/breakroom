// Apply necessary plugins
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Android configuration
android {
    namespace "com.acvetne.breakroom"
    compileSdk 35

    defaultConfig {
        applicationId 'com.acvetne.breakroom'
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 4
        versionName "1.03"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Release signing comes from android/keystore.properties (gitignored) or
    // environment variables. See android/keystore.properties.example.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def signingValue = { String key -> keystoreProps.getProperty(key) ?: System.getenv(key) }

    signingConfigs {
        release {
            if (signingValue("KEYSTORE_FILE")) {
                storeFile file(signingValue("KEYSTORE_FILE"))
                storePassword signingValue("KEYSTORE_PASSWORD")
                keyAlias signingValue("KEY_ALIAS")
                keyPassword signingValue("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("release")
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
        }
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}

// Optional: Google Services plugin if google-services.json exists
def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.text.trim()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info("google-services.json not found, Google services plugin not applied.")
}
