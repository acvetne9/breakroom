<!DOCTYPE html>
<html>
<head>
    <title>Test Tile Access</title>
</head>
<body>
    <h1>Testing Tile Access</h1>
    <p>Open browser dev tools and check if this URL loads:</p>
    <p><a href="/data/tiles/12/1203/1536.pbf" target="_blank">/data/tiles/12/1203/1536.pbf</a></p>
    <p>If it downloads or shows content, tiles are accessible.</p>
    
    <script>
        console.log('Testing tile URL fetch...');
        fetch('/data/tiles/12/1203/1536.pbf')
            .then(response => {
                console.log('Tile response status:', response.status);
                console.log('Tile response headers:', [...response.headers.entries()]);
                return response.arrayBuffer();
            })
            .then(buffer => {
                console.log('Tile buffer size:', buffer.byteLength, 'bytes');
                console.log('Tile data accessible ✅');
            })
            .catch(error => {
                console.error('Tile access failed ❌:', error);
            });
    </script>
</body>
</html>
